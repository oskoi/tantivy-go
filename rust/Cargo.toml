[package]
name = "tantivy-go"
version = "1.0.0"
edition = "2021"
build = "src/build.rs"

[lib]
crate-type = ["staticlib"]

[build-dependencies]
cbindgen = "0.28.0"

[dependencies]
tantivy = { git = "https://github.com/quickwit-oss/tantivy.git", rev = "b4139bc3536ac7217995633cbd469a4bf2a23fc3" }
cbindgen = "0.28.0"
log = "0.4.26"
env_logger = "0.11.6"
serde_json = "1.0.139"
serde = { version = "1.0.218", features = ["derive"] }
unicode-segmentation = "1.12.0"
logcall = "0.1.11"
lazy_static = "1.5.0"
phf = { version = "0.11.2", features = ["macros"] }
crunchy = "=0.2.2" #https://github.com/eira-fransham/crunchy/issues/13
